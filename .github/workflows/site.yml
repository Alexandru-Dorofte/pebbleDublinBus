# Rebuilds the per-stop timetable files from TFI's static GTFS every day and
# publishes them to GitHub Pages, where the phone app downloads them.
name: Timetable site
on:
  schedule:
    - cron: '30 3 * * *'   # 03:30 UTC, after TFI's nightly GTFS update
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: TZ=Europe/Dublin python3 build_site.py "" site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
